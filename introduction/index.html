
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Space</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div id="app">
    <header class="top">
        
        <span class="clock">{{ currentTime }}</span>
    </header>

    <main class="hero">
        <p class="eyebrow">A BIT ABOUT ME</p>
        <h1>
            PARK HYE J<span class="bounce-i">I</span>N
        </h1>

        <p class="desc">
            저의 이야기를 담은 공간에 오신 것을 환영합니다.
        </p>

        <button class="enter-btn" @click="goProfile">
            EXPLORE MY PROFILE <span>↗</span>
        </button>
        
    </main>

    <footer>
        
        <span>© 2026 JIN</span>
    </footer>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            currentTime: '',
            timer: null
        };
    },

    methods: {
        updateTime() {
            this.currentTime = new Date().toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        },

        goProfile() {
            const answer = confirm('프로필 페이지로 이동할까요?');

            if (answer) {
                location.href = 'introduce.html';
            }
        }
    },

    mounted() {
        this.updateTime();
        this.timer = setInterval(this.updateTime, 1000);
    },

    beforeUnmount() {
        clearInterval(this.timer);
    }
}).mount('#app');
</script>

</body>
</html>
